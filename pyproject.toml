[project]
name = "yardsviewer"
version = "0.1.0"
description = "Race dashboards for backyard/frontyard ultra events"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "truststore>=0.10.5",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.mypy]
python_version = "3.12"
files = ["backend"]
explicit_package_bases = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true
